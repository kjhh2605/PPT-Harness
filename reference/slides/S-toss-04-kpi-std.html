<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="source" content="https://notefolio.net/bysu.ppt/325182">
<meta name="reference-image" content="slide-04.webp">
<title>고객 설문 KPI · Gnar</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root {
  /* Gnar 브랜드 토큰 — Deep Indigo Ink (H 283). 원천: design/palettes/brand.json */
  --hue: 283;
  --bg: #EDE9E6;  /* 배경 */
  --surface: #F7F3EF;  /* 카드·패널 */
  --text: #262321;  /* 본문 */
  --muted: #666260;  /* 보조 글자·캡션 */
  --border: #D1CDCA;  /* 선·격자·비포커스 막대 */
  --ink: #37356A;  /* 제목·강조 문장 */
  --hero: #5A54AF;  /* 강조 한 곳(핵심 숫자·포커스 막대·구분선) */
  --support: #8183A4;  /* 보조 막대·아이콘 */
  --tint: #DEDFF5;  /* 콜아웃·표 머리 배경 띠 */
  --brown: #826144;  /* 따뜻한 중립 1 */
  --taupe: #736756;  /* 따뜻한 중립 2 */
  --chart-1: var(--hero);
  --chart-2: var(--support);
  --chart-3: var(--brown);
  --chart-4: var(--taupe);
  --chart-5: var(--border);
}

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #181513;
  --surface: #24211F;
  --text: #E8E4E1;
  --muted: #A19E9B;
  --border: #383532;
  --ink: #CACCFE;
  --hero: #9391F2;
  --support: #707191;
  --tint: #28293F;
  --brown: #B49072;
  --taupe: #A39684;
  color-scheme: dark;
} }

:root[data-theme="dark"] {
  --bg: #181513;
  --surface: #24211F;
  --text: #E8E4E1;
  --muted: #A19E9B;
  --border: #383532;
  --ink: #CACCFE;
  --hero: #9391F2;
  --support: #707191;
  --tint: #28293F;
  --brown: #B49072;
  --taupe: #A39684;
  color-scheme: dark;
}

/* 발표별 색상 교체 레시피 (oklch 지원 브라우저). hex 토큰은 PPTX 변환용 기준값이며,
 * 다른 색상으로 바꿀 때는 design/scripts/ladder.py 에 hue 값을 넣어 hex를 다시 생성한다.
 *   light: ink oklch(.36 .09 H) hero oklch(.50 .14 H) support oklch(.62 .05 H) tint oklch(.91 .03 H)
 *   dark : ink oklch(.86 .07 H) hero oklch(.70 .14 H) support oklch(.56 .05 H) tint oklch(.29 .04 H) */


* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; -webkit-font-smoothing: antialiased; }
.viewport { width: 100%; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); place-items: center; overflow: hidden; }
.slide { width: 1920px; height: 1080px; position: relative; overflow: hidden; flex-shrink: 0; fill: var(--text); background: var(--surface); transform-origin: center center; }
h1, h2, h3, p, figure { margin: 0; }
svg { display: block; }
.eyebrow { font-size: 25px; font-weight: 650; color: var(--muted); letter-spacing: -.4px; }
.slide-title { font-size: 64px; font-weight: 750; line-height: 1.25; letter-spacing: -2.3px; color: var(--ink); word-break: keep-all; }
.slide-copy { font-size: 28px; line-height: 1.6; letter-spacing: -.6px; color: var(--muted); word-break: keep-all; }
.slide-header { position: absolute; top: 112px; left: 132px; right: 132px; }
.slide-header .eyebrow { margin-bottom: 20px; }
.slide-header .slide-copy { margin-top: 25px; }
.slide-footer { position: absolute; left: 132px; right: 132px; bottom: 60px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; line-height: 1; color: var(--muted); }
.wordmark { color: var(--ink); font-size: 30px; font-weight: 800; letter-spacing: -1.4px; }
.screen-reader-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
@media print {
  @page { size: 20in 11.25in; margin: 0; }
  html, body, .viewport { width: 1920px; height: 1080px; overflow: visible; }
  .slide { transform: none !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
}


/* This reference is intentionally dark even when the containing catalog is light. */
:root, :root[data-theme="light"], :root[data-theme="dark"] {
  --bg: #181513; --surface: #24211F; --text: #E8E4E1;
  --muted: #A19E9B; --border: #383532; --ink: #CACCFE;
  --hero: #9391F2; --support: #707191; --tint: #28293F;
  --brown: #B49072; --taupe: #A39684; color-scheme: dark;
}
body, .slide { background: var(--bg); }
.growth-line { position: absolute; inset: 0; width: 1920px; height: 1080px; }
.growth-line path { fill: none; stroke: var(--tint); stroke-width: 5; stroke-linecap: round; opacity: .20; }
.message { position: absolute; top: 416px; left: 156px; }
.message h1 { color: var(--text); font-size: 48px; font-weight: 750; line-height: 1.32; letter-spacing: -1.65px; }
.metrics { position: absolute; left: 156px; top: 626px; display: flex; gap: 224px; margin: 0; padding: 0; }
.metric { width: 314px; }
.metric dt { color: var(--muted); font-size: 31px; font-weight: 650; line-height: 1.35; letter-spacing: -1.3px; }
.metric dd { margin: 27px 0 0 -5px; color: var(--text); font-size: 100px; font-weight: 740; line-height: 1; letter-spacing: -2px; }
.survey-note { position: absolute; left: 156px; top: 894px; color: var(--muted); font-size: 23px; line-height: 1.4; letter-spacing: -.5px; }
.pie-figure { position: absolute; left: 1293.75px; top: 454.6875px; width: 459.375px; height: 487.5px; }
.pie-figure svg { width: 100%; height: 100%; overflow: visible; }
.pie-top, .pie-front-top { fill: var(--text); }
.pie-side, .pie-face-left { fill: var(--muted); }
.pie-face-right, .slice-side, .slice-cut { fill: var(--support); }
.slice-top { fill: var(--hero); }

</style>
</head>
<body>
<div class="viewport"><main class="slide" data-slide-id="S-toss-04-kpi-std" aria-label="고객 설문 KPI">
<svg class="growth-line" viewBox="0 0 1920 1080" aria-hidden="true">
  <path d="M 552 1088 C 638 995 672 927 737 853 S 832 771 882 749 S 995 728 1048 710 S 1135 653 1171 602 S 1230 528 1287 478 S 1396 424 1444 384 S 1494 324 1521 281 S 1625 216 1697 148 S 1844 41 1928 -8" />
</svg>
<section class="message" aria-label="핵심 메시지">
  <h1>전달하고 싶은 메시지를<br>두 줄 정도로 작성해주세요</h1>
</section>
<dl class="metrics" aria-label="고객 설문 결과 예시">
  <div class="metric"><dt>서비스 만족도</dt><dd>100%</dd></div>
  <div class="metric"><dt>서비스 재구매율</dt><dd>100%</dd></div>
</dl>
<p class="survey-note">0000년 00월 기준 모든 고객 대상 설문조사 결과</p>
<figure class="pie-figure" aria-label="분리된 조각이 있는 입체 파이차트 모티프">
  <svg viewBox="1380 485 490 520" role="img" aria-labelledby="pie-title">
    <title id="pie-title">고객 설문 결과를 표현하는 파이차트 장식</title>
    <!-- 앞쪽 몸통과 절단면을 단색 레이어로 표현한다. -->
    <path class="pie-side" d="M1414 699 C1417 758 1418 821 1443 864 C1489 947 1591 981 1690 955 L1694 874 C1599 900 1499 855 1452 794 Z"/>
    <path class="pie-top" d="M1414 700 C1400 611 1460 544 1544 523 C1620 503 1696 516 1756 554 C1812 589 1838 638 1831 682 L1818 725 L1621 664 Z"/>
    <path class="pie-face-left" d="M1414 700 L1621 664 L1622 716 L1420 754 Z"/>
    <path class="pie-face-right" d="M1621 664 L1818 725 L1811 806 L1622 716 Z"/>
    <path class="pie-front-top" d="M1420 754 L1622 716 L1694 874 C1612 903 1530 869 1474 823 C1442 797 1426 772 1420 754 Z"/>
    <!-- 분리된 단일 포커스 조각: hero는 이 조각의 윗면에만 적용한다. -->
    <path class="slice-side" d="M1645 754 L1717 911 L1714 963 C1772 947 1817 917 1829 872 L1835 815 Z"/>
    <path class="slice-cut" d="M1645 754 L1717 911 L1714 963 L1697 917 Z"/>
    <path class="slice-top" d="M1645 754 L1835 815 C1823 863 1779 897 1717 911 Z"/>
  </svg>
</figure>
</main></div>
<script>
(() => {
  const slide = document.querySelector('.slide');
  const fit = () => { slide.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; };
  const theme = new URLSearchParams(location.search).get('theme');
  if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
  addEventListener('resize', fit); fit();
  // file:// frames have isolated origins; relay navigation without reading parent DOM.
  if (parent !== window) document.addEventListener('keydown', event => {
    if (!['ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End', 'Escape', 'f', 'F'].includes(event.key)) return;
    if (event.target.closest('button,input,textarea,select,[contenteditable],.carousel-controls,.carousel-nav')) return;
    queueMicrotask(() => {
      if (!event.defaultPrevented) parent.postMessage({ type: 'gnar-slide-key', key: event.key, shiftKey: event.shiftKey }, '*');
    });
  });

})();
</script>
</body>
</html>

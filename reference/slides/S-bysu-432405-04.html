<div class="viewport"><main class="slide" data-slide-id="S-bysu-432405-04" aria-label="트렌디한 PPT를 만들 수 있도록 디자인 스킬을 알려드려요"><header class="heading"><div class="kicker">강의 목표</div><h1 class="title">트렌디한 PPT를 만들 수 있도록<br>디자인 스킬을 알려드려요</h1><p class="copy">PPT 실력을 한 단계 더 업그레이드하고 싶은 분들을 위해<br>세부적인 디자인 방법을 알려드립니다.</p></header><div class="compare before"><div class="status">×</div><div class="answer">어떤 폰트를 사용해야 하지?</div><div class="answer">디자인 컨셉은 어떻게 잡아야 할까?</div><div class="answer">어떤 아이콘을 사용해야 좋을까?</div></div><svg class="arrow" viewBox="0 0 50 70" aria-hidden="true"><path d="M14 12L36 35L14 58" stroke="var(--border)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="compare after"><div class="status">✓</div><div class="answer">깔끔한 느낌을 주기 위해 이 폰트를 사용해야겠다!</div><div class="answer">이 자료를 참고해서 전체 컨셉을 잡아야겠다!</div><div class="answer">통일성을 위해 이 아이콘을 사용해야겠다!</div></div></main></div>
<script>
(() => {
  const slide = document.querySelector('.slide');
  const fit = () => { slide.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; };
  const theme = new URLSearchParams(location.search).get('theme');
  if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
  addEventListener('resize', fit); fit();
  // file:// frames have isolated origins; relay navigation without reading parent DOM.
  if (parent !== window) document.addEventListener('keydown', event => {
    if (!['ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End', 'Escape', 'f', 'F'].includes(event.key)) return;
    if (event.target.closest('button,input,textarea,select,[contenteditable],.carousel-controls,.carousel-nav')) return;
    queueMicrotask(() => {
      if (!event.defaultPrevented) parent.postMessage({ type: 'gnar-slide-key', key: event.key, shiftKey: event.shiftKey }, '*');
    });
  });
})();
</script>

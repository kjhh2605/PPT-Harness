* { box-sizing: border-box; }

<body>
<div class="viewport"><main class="slide" data-slide-id="S-bysu-452912-02" aria-label="좋은 제품을 어떻게 보여주느냐"><p class="intro-label">Lifestyle Select Vendor</p><div class="intro-text"><h1>좋은 제품을 <em>어떻게 보여주느냐</em>가<br>픽앤센스의 경쟁력입니다.</h1><p>픽앤센스는 SNS 벤더사로 브랜드와 신뢰를 파는 크리에이터와의<br>만남을 주선합니다. 핏이 맞는 셀러와의 매칭과 판매를 자신합니다.</p><p>SNS를 기반으로 트렌디하고 경쟁력 있는 제품을 큐레이션하며,<br>인스타그램, 틱톡, 유튜브 등에서 공동구매 마케팅을 진행합니다.</p><p>감도 높은 제품 큐레이션과 정제된 콘텐츠 기획으로<br>30–40대 여성 고객에게 신뢰받는 쇼핑 경험을 제공합니다.</p></div><div class="business-cards"><svg viewBox="0 0 762 1080" style="width:762px;height:1080px" aria-label="명함 사진을 대각선 명함 도형으로 재구성" role="img"><rect width="762" height="1080" fill="var(--tint)"/><path d="M0 65L762 758M0 85L762 778" stroke="var(--border)" stroke-width="20"/><path d="M0 65L762 758" stroke="var(--surface)" stroke-width="20"/><g transform="translate(506 310) rotate(43)"><rect x="-225" y="-155" width="450" height="310" fill="var(--border)"/><rect x="-237" y="-167" width="450" height="310" fill="var(--surface)"/><text x="-12" y="-1" fill="var(--ink)" font-weight="800" font-size="42" text-anchor="middle">Pick&amp;Sense</text></g><g transform="translate(225 750) rotate(-22)"><rect x="-180" y="-190" width="360" height="380" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/></g><g transform="translate(205 740) rotate(-9)"><rect x="-180" y="-190" width="360" height="380" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/><text x="0" y="100" fill="var(--ink)" font-size="30" font-weight="700" text-anchor="middle">Pick&amp;Sense</text></g><g transform="translate(365 686) rotate(43)"><rect x="-225" y="-151" width="450" height="302" fill="var(--support)"/><rect x="-233" y="-159" width="450" height="302" fill="var(--tint)" stroke="var(--border)" stroke-width="2"/><text x="-8" y="0" fill="var(--ink)" font-weight="800" font-size="42" text-anchor="middle">Pick&amp;Sense</text></g></svg></div></main></div>
<script>
(() => {
  const slide = document.querySelector('.slide');
  const fit = () => { slide.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; };
  const theme = new URLSearchParams(location.search).get('theme');
  if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
  addEventListener('resize', fit); fit();
  // file:// frames have isolated origins; relay navigation without reading parent DOM.
  if (parent !== window) document.addEventListener('keydown', event => {
    if (!['ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End', 'Escape', 'f', 'F'].includes(event.key)) return;
    if (event.target.closest('button,input,textarea,select,[contenteditable],.carousel-controls,.carousel-nav')) return;
    queueMicrotask(() => {
      if (!event.defaultPrevented) parent.postMessage({ type: 'gnar-slide-key', key: event.key, shiftKey: event.shiftKey }, '*');
    });
  });

})();
</script>

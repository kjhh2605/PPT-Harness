}

<div class="viewport"><main class="slide" data-slide-id="S-bysu-447028-02" aria-label="제로 트러스트, 신뢰의 의미를 재정의하다"><svg class="diagonal-bg" viewBox="0 0 1920 1080" aria-hidden="true"><g fill="var(--surface)"><g transform="translate(-370 110) rotate(-27 1075 80)"><rect width="2150" height="160"/></g><g transform="translate(490 710) rotate(-27 1075 80)"><rect width="2150" height="160"/></g></g></svg><div class="dictionary"><div class="search">신뢰<span class="search-icon"></span></div><h2>신뢰 <small>信賴</small></h2><p><b>명사</b> 굳게 믿고 의지함.</p><blockquote>신뢰를 느끼다.<br>신뢰가 가다.<br>그는 신뢰를 받는다.</blockquote></div><section class="definition"><div class="brand " aria-label="PRIBIT"><svg viewBox="0 0 105 28" aria-hidden="true"><g fill="var(--ink)"><rect x="2" y="4" width="4" height="13" rx="2"/><rect x="20" y="4" width="4" height="20" rx="2"/><rect x="38" y="4" width="4" height="13" rx="2"/><rect x="56" y="4" width="4" height="20" rx="2"/><rect x="74" y="4" width="4" height="13" rx="2"/></g><rect x="89" y="4" width="14" height="15" rx="3" fill="none" stroke="var(--ink)" stroke-width="4"/></svg><b>PRIBIT</b></div><h1>제로 트러스트<br><span class="accent">신뢰의 의미</span>를<br>재정의하다</h1><p>우리는 오랫동안 ‘접속’을 신뢰의 기준으로 삼아왔습니다.<br>누구든 접속만 하면 안전하다는 믿음, 이제 버려야 합니다.</p></section></main></div>
<script>
(() => {
  const slide = document.querySelector('.slide');
  const fit = () => { slide.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; };
  const theme = new URLSearchParams(location.search).get('theme');
  if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
  addEventListener('resize', fit); fit();
  // file:// frames have isolated origins; relay navigation without reading parent DOM.
  if (parent !== window) document.addEventListener('keydown', event => {
    if (!['ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End', 'Escape', 'f', 'F'].includes(event.key)) return;
    if (event.target.closest('button,input,textarea,select,[contenteditable],.carousel-controls,.carousel-nav')) return;
    queueMicrotask(() => {
      if (!event.defaultPrevented) parent.postMessage({ type: 'gnar-slide-key', key: event.key, shiftKey: event.shiftKey }, '*');
    });
  });
})();
</script>

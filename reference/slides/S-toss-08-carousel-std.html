<!doctype html>

<title>겹친 카드 캐러셀 · Gnar</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root {
  /* Gnar 브랜드 토큰 — Deep Indigo Ink (H 283). 원천: design/palettes/brand.json */
  --hue: 283;
  --bg: #EDE9E6;  /* 배경 */
  --surface: #F7F3EF;  /* 카드·패널 */
  --text: #262321;  /* 본문 */
  --muted: #666260;  /* 보조 글자·캡션 */
  --border: #D1CDCA;  /* 선·격자·비포커스 막대 */
  --ink: #37356A;  /* 제목·강조 문장 */
  --hero: #5A54AF;  /* 강조 한 곳(핵심 숫자·포커스 막대·구분선) */
  --support: #8183A4;  /* 보조 막대·아이콘 */
  --tint: #DEDFF5;  /* 콜아웃·표 머리 배경 띠 */
  --brown: #826144;  /* 따뜻한 중립 1 */
  --taupe: #736756;  /* 따뜻한 중립 2 */
  --chart-1: var(--hero);
  --chart-2: var(--support);
  --chart-3: var(--brown);
  --chart-4: var(--taupe);
  --chart-5: var(--border);
}

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #181513;
  --surface: #24211F;
  --text: #E8E4E1;
  --muted: #A19E9B;
  --border: #383532;
  --ink: #CACCFE;
  --hero: #9391F2;
  --support: #707191;
  --tint: #28293F;
  --brown: #B49072;
  --taupe: #A39684;
  color-scheme: dark;
} }

:root[data-theme="dark"] {
  --bg: #181513;
  --surface: #24211F;
  --text: #E8E4E1;
  --muted: #A19E9B;
  --border: #383532;
  --ink: #CACCFE;
  --hero: #9391F2;
  --support: #707191;
  --tint: #28293F;
  --brown: #B49072;
  --taupe: #A39684;
  color-scheme: dark;
}

/* 발표별 색상 교체 레시피 (oklch 지원 브라우저). hex 토큰은 PPTX 변환용 기준값이며,
 * 다른 색상으로 바꿀 때는 design/scripts/ladder.py 에 hue 값을 넣어 hex를 다시 생성한다.
 *   light: ink oklch(.36 .09 H) hero oklch(.50 .14 H) support oklch(.62 .05 H) tint oklch(.91 .03 H)
 *   dark : ink oklch(.86 .07 H) hero oklch(.70 .14 H) support oklch(.56 .05 H) tint oklch(.29 .04 H) */


* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; -webkit-font-smoothing: antialiased; }
.viewport { width: 100%; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); place-items: center; overflow: hidden; }
.slide { width: 1920px; height: 1080px; position: relative; overflow: hidden; flex-shrink: 0; fill: var(--text); background: var(--surface); transform-origin: center center; }
h1, h2, h3, p, figure { margin: 0; }
svg { display: block; }
.eyebrow { font-size: 25px; font-weight: 650; color: var(--muted); letter-spacing: -.4px; }
.slide-title { font-size: 64px; font-weight: 750; line-height: 1.25; letter-spacing: -2.3px; color: var(--ink); word-break: keep-all; }
.slide-copy { font-size: 28px; line-height: 1.6; letter-spacing: -.6px; color: var(--muted); word-break: keep-all; }
.slide-header { position: absolute; top: 112px; left: 132px; right: 132px; }
.slide-header .eyebrow { margin-bottom: 20px; }
.slide-header .slide-copy { margin-top: 25px; }
.slide-footer { position: absolute; left: 132px; right: 132px; bottom: 60px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; line-height: 1; color: var(--muted); }
.wordmark { color: var(--ink); font-size: 30px; font-weight: 800; letter-spacing: -1.4px; }
.screen-reader-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
@media print {
  @page { size: 20in 11.25in; margin: 0; }
  html, body, .viewport { width: 1920px; height: 1080px; overflow: visible; }
  .slide { transform: none !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
}


.carousel-heading { position: absolute; inset: 153px 100px auto; text-align: center; }
.carousel-heading h1 { color: var(--ink); font-size: 50px; line-height: 1.36; font-weight: 760; letter-spacing: -1.9px; }
.carousel-heading p { margin-top: 48px; color: var(--muted); font-size: 28px; font-weight: 400; line-height: 1.64; letter-spacing: -1.25px; white-space: nowrap; }
.carousel { position: absolute; inset: 530px 0 128px; }
.cards { position: absolute; inset: 0; }
.card { position: absolute; background: var(--bg); border: 1px solid var(--bg); box-shadow: 0 0 4px var(--surface), 0 1px 1px var(--border); transition: left 440ms ease, top 440ms ease, width 440ms ease, height 440ms ease, border-radius 440ms ease; }
.card[data-slot="-2"] { left: 297px; top: 88px; width: 246px; height: 246px; border-radius: 24px; z-index: 1; }
.card[data-slot="-1"] { left: 466px; top: 44px; width: 332px; height: 332px; border-radius: 34px; z-index: 2; border-bottom-color: var(--border); }
.card[data-slot="0"] { left: 748px; top: 0; width: 424px; height: 422px; border-radius: 44px; z-index: 3; border-bottom-color: var(--border); }
.card[data-slot="1"] { left: 1123px; top: 38px; width: 332px; height: 332px; border-radius: 34px; z-index: 2; border-bottom-color: var(--border); }
.card[data-slot="2"] { left: 1377px; top: 88px; width: 246px; height: 246px; border-radius: 24px; z-index: 1; }
.carousel-arrow { position: absolute; top: 174px; width: 72px; height: 72px; padding: 14px 22px; border: 0; border-radius: 18px; background: transparent; color: var(--muted); cursor: pointer; z-index: 4; }
.carousel-arrow svg { width: 28px; height: 44px; fill: none; stroke: currentColor; stroke-width: 5.8; stroke-linecap: round; stroke-linejoin: round; }
.carousel-arrow.previous { left: 92px; }
.carousel-arrow.next { right: 92px; }
.carousel-arrow:hover { color: var(--ink); }
.carousel-arrow:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
@media print { .carousel-arrow { cursor: default; } }

</style>
</head>
<body>
<div class="viewport"><main class="slide" data-slide-id="S-toss-08-carousel-std" aria-label="겹친 카드 캐러셀">
<header class="carousel-heading">
  <h1>슬라이드의 제목을<br>두 줄 정도로 작성해주세요</h1>
  <p>슬라이드의 본문을 작성해주세요 슬라이드의 본문을 작성해주세요 슬라이드의 본문을 작성해주세요<br>
  슬라이드의 본문을 작성해주세요 슬라이드의 본문을 작성해주세요 슬라이드의 본문을 작성해주세요<br>
  슬라이드의 본문을 작성해주세요 슬라이드의 본문을 작성해주세요</p>
</header>
<section class="carousel" aria-roledescription="캐러셀" aria-label="다섯 장의 겹친 카드">
  <div class="cards" id="carousel-cards">
    <div class="card" data-card="0" data-slot="-2" role="group" aria-roledescription="슬라이드" aria-label="카드 1 / 5"><span class="screen-reader-only">첫 번째 카드</span></div>
    <div class="card" data-card="1" data-slot="-1" role="group" aria-roledescription="슬라이드" aria-label="카드 2 / 5"><span class="screen-reader-only">두 번째 카드</span></div>
    <div class="card" data-card="2" data-slot="0" role="group" aria-roledescription="슬라이드" aria-label="카드 3 / 5" aria-current="true"><span class="screen-reader-only">세 번째 카드</span></div>
    <div class="card" data-card="3" data-slot="1" role="group" aria-roledescription="슬라이드" aria-label="카드 4 / 5"><span class="screen-reader-only">네 번째 카드</span></div>
    <div class="card" data-card="4" data-slot="2" role="group" aria-roledescription="슬라이드" aria-label="카드 5 / 5"><span class="screen-reader-only">다섯 번째 카드</span></div>
  </div>
  <button type="button" class="carousel-arrow previous" aria-label="이전 카드" aria-controls="carousel-cards"><svg viewBox="0 0 32 48" aria-hidden="true"><path d="M23 7 7 24l16 17"/></svg></button>
  <button type="button" class="carousel-arrow next" aria-label="다음 카드" aria-controls="carousel-cards"><svg viewBox="0 0 32 48" aria-hidden="true"><path d="m9 7 16 17L9 41"/></svg></button>
  <p class="screen-reader-only" role="status" aria-live="polite" aria-atomic="true" id="carousel-status">카드 3 / 5 선택됨</p>
</section>
<script>
(() => {
  const root = document.querySelector('.carousel');
  const cards = [...root.querySelectorAll('.card')];
  const status = root.querySelector('#carousel-status');
  let current = 2;
  const move = (direction) => {
    current = (current + direction + cards.length) % cards.length;
    cards.forEach((card, index) => {
      card.dataset.slot = String((index - current + cards.length + 2) % cards.length - 2);
      if (index === current) card.setAttribute('aria-current', 'true');
      else card.removeAttribute('aria-current');
    });
    status.textContent = `카드 ${current + 1} / ${cards.length} 선택됨`;
  };
  root.querySelector('.previous').addEventListener('click', () => move(-1));
  root.querySelector('.next').addEventListener('click', () => move(1));
  root.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      move(event.key === 'ArrowLeft' ? -1 : 1);
    }
  });
})();
</script>
</main></div>
<script>
(() => {
  const slide = document.querySelector('.slide');
  const fit = () => { slide.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; };
  const theme = new URLSearchParams(location.search).get('theme');
  if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
  addEventListener('resize', fit); fit();
  // file:// frames have isolated origins; relay navigation without reading parent DOM.
  if (parent !== window) document.addEventListener('keydown', event => {
    if (!['ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End', 'Escape', 'f', 'F'].includes(event.key)) return;
    if (event.target.closest('button,input,textarea,select,[contenteditable],.carousel-controls,.carousel-nav')) return;
    queueMicrotask(() => {
      if (!event.defaultPrevented) parent.postMessage({ type: 'gnar-slide-key', key: event.key, shiftKey: event.shiftKey }, '*');
    });
  });

})();
</script>
</body>

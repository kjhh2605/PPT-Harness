<style>
:root {
  /* Gnar 브랜드 토큰 — Deep Indigo Ink (H 283). 원천: design/palettes/brand.json */
  --hue: 283;
  --bg: #EDE9E6;  /* 배경 */
  --surface: #F7F3EF;  /* 카드·패널 */
  --text: #262321;  /* 본문 */
  --muted: #666260;  /* 보조 글자·캡션 */
  --border: #D1CDCA;  /* 선·격자·비포커스 막대 */
  --ink: #37356A;  /* 제목·강조 문장 */
  --hero: #5A54AF;  /* 강조 한 곳(핵심 숫자·포커스 막대·구분선) */
  --support: #8183A4;  /* 보조 막대·아이콘 */
  --tint: #DEDFF5;  /* 콜아웃·표 머리 배경 띠 */
  --brown: #826144;  /* 따뜻한 중립 1 */
  --taupe: #736756;  /* 따뜻한 중립 2 */
  --chart-1: var(--hero);
  --chart-2: var(--support);
  --chart-3: var(--brown);
  --chart-4: var(--taupe);
  --chart-5: var(--border);
}

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #181513;
  --surface: #24211F;
  --text: #E8E4E1;
  --muted: #A19E9B;
  --border: #383532;
  --ink: #CACCFE;
  --hero: #9391F2;
  --support: #707191;
  --tint: #28293F;
  --brown: #B49072;
  --taupe: #A39684;
  color-scheme: dark;
} }

:root[data-theme="dark"] {
  --bg: #181513;
  --surface: #24211F;
  --text: #E8E4E1;
  --muted: #A19E9B;
  --border: #383532;
  --ink: #CACCFE;
  --hero: #9391F2;
  --support: #707191;
  --tint: #28293F;
  --brown: #B49072;
  --taupe: #A39684;
  color-scheme: dark;
}

/* 발표별 색상 교체 레시피 (oklch 지원 브라우저). hex 토큰은 PPTX 변환용 기준값이며,
 * 다른 색상으로 바꿀 때는 design/scripts/ladder.py 에 hue 값을 넣어 hex를 다시 생성한다.
 *   light: ink oklch(.36 .09 H) hero oklch(.50 .14 H) support oklch(.62 .05 H) tint oklch(.91 .03 H)
 *   dark : ink oklch(.86 .07 H) hero oklch(.70 .14 H) support oklch(.56 .05 H) tint oklch(.29 .04 H) */


* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; -webkit-font-smoothing: antialiased; }
.viewport { width: 100%; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); place-items: center; overflow: hidden; }
.slide { width: 1920px; height: 1080px; position: relative; overflow: hidden; flex-shrink: 0; fill: var(--text); background: var(--surface); transform-origin: center center; }
h1, h2, h3, p, figure { margin: 0; }
svg { display: block; }
.eyebrow { font-size: 25px; font-weight: 650; color: var(--muted); letter-spacing: -.4px; }
.slide-title { font-size: 64px; font-weight: 750; line-height: 1.25; letter-spacing: -2.3px; color: var(--ink); word-break: keep-all; }
.slide-copy { font-size: 28px; line-height: 1.6; letter-spacing: -.6px; color: var(--muted); word-break: keep-all; }
.slide-header { position: absolute; top: 112px; left: 132px; right: 132px; }
.slide-header .eyebrow { margin-bottom: 20px; }
.slide-header .slide-copy { margin-top: 25px; }
.slide-footer { position: absolute; left: 132px; right: 132px; bottom: 60px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; line-height: 1; color: var(--muted); }
.wordmark { color: var(--ink); font-size: 30px; font-weight: 800; letter-spacing: -1.4px; }
.screen-reader-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
@media print {
  @page { size: 20in 11.25in; margin: 0; }
  html, body, .viewport { width: 1920px; height: 1080px; overflow: visible; }
  .slide { transform: none !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
}


.slide{background:var(--bg)}
.header{position:absolute;left:92px;top:96px;right:92px}
.kicker{font-size:28px;line-height:1.3;font-weight:650;color:var(--ink);margin-bottom:20px}
.title{font-size:52px;line-height:1.35;letter-spacing:-2px;font-weight:750;color:var(--ink)}
.copy{font-size:28px;line-height:1.55;letter-spacing:-.6px;color:var(--muted);margin-top:18px}
.hero-text{color:var(--hero)}
.card{background:var(--surface);border-radius:32px;border:1px solid var(--border)}
.card-title{font-size:31px;line-height:1.4;font-weight:700;color:var(--ink);letter-spacing:-.7px}
.card-copy{font-size:28px;line-height:1.55;color:var(--muted);letter-spacing:-.6px;margin-top:18px}

.timeline-line{position:absolute;top:450px;left:0;right:0;border-top:3px dashed var(--border)}.steps{position:absolute;top:378px;left:94px;right:94px;display:grid;grid-template-columns:repeat(4,1fr);gap:44px}.step{position:relative;text-align:center}.step-number{font-size:29px;line-height:42px;font-weight:650;color:var(--ink)}.step-dot{display:block;position:absolute;top:65px;left:calc(50% - 8px);width:16px;height:16px;background:var(--border);border-radius:50%}.step:first-child .step-dot{background:var(--hero)}.step-card{height:444px;margin-top:86px;padding:24px 26px}.step-card h2{height:74px;display:flex;align-items:center;justify-content:center;font-size:30px;letter-spacing:-.6px;font-weight:600;color:var(--ink);background:var(--tint);border-radius:22px}.step-card .down{margin:20px auto}.step-card p{height:74px;background:var(--bg);border-radius:21px;margin-bottom:15px;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted);letter-spacing:-1.1px;white-space:nowrap}

</style>

<body>
<div class="viewport"><main class="slide" data-slide-id="S-bysu-444405-05" aria-label="초기사업검증 컨설팅"><header class="header"><p class="kicker">STEP 2. 초기사업검증 컨설팅</p><h1 class="title">팔릴 것인가 아닌가, 지금 테스트하세요</h1><p class="copy">시장 반응을 수치로 확인하는 MVP 실험 시스템, 감이 아닌 데이터로 반응을 확인합니다.</p></header><div class="timeline-line"></div><div class="steps"><section class="step"><p class="step-number">STEP 1</p><i class="step-dot"></i><div class="step-card card"><h2>MVP 가설 설정</h2><svg class="down" width="32" height="28" viewBox="0 0 32 28" aria-hidden="true"><path d="m3 7 13 13L29 7" fill="none" stroke="var(--muted)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><p>시장 조사</p><p>경쟁사 조사</p><p>고객 조사</p></div></section><section class="step"><p class="step-number">STEP 2</p><i class="step-dot"></i><div class="step-card card"><h2>MVP 설계</h2><svg class="down" width="32" height="28" viewBox="0 0 32 28" aria-hidden="true"><path d="m3 7 13 13L29 7" fill="none" stroke="var(--muted)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><p>가설 퍼널 설계</p><p>가설 랜딩페이지 제작</p><p>가설 광고 콘텐츠 제작</p></div></section><section class="step"><p class="step-number">STEP 3</p><i class="step-dot"></i><div class="step-card card"><h2>시장 검증</h2><svg class="down" width="32" height="28" viewBox="0 0 32 28" aria-hidden="true"><path d="m3 7 13 13L29 7" fill="none" stroke="var(--muted)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><p>SNS 광고</p><p>팝업스토어 검증</p></div></section><section class="step"><p class="step-number">STEP 4</p><i class="step-dot"></i><div class="step-card card"><h2>결과 보고서</h2><svg class="down" width="32" height="28" viewBox="0 0 32 28" aria-hidden="true"><path d="m3 7 13 13L29 7" fill="none" stroke="var(--muted)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><p>광고 반응 테스트 보고서</p><p>고객 반응 테스트 보고서</p></div></section></div></main></div>
<script>
(() => {
  const slide = document.querySelector('.slide');
  const fit = () => { slide.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; };
  const theme = new URLSearchParams(location.search).get('theme');
  if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
  addEventListener('resize', fit); fit();
  // file:// frames have isolated origins; relay navigation without reading parent DOM.
  if (parent !== window) document.addEventListener('keydown', event => {
    if (!['ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End', 'Escape', 'f', 'F'].includes(event.key)) return;
    if (event.target.closest('button,input,textarea,select,[contenteditable],.carousel-controls,.carousel-nav')) return;
    queueMicrotask(() => {
      if (!event.defaultPrevented) parent.postMessage({ type: 'gnar-slide-key', key: event.key, shiftKey: event.shiftKey }, '*');
    });
  });
})();
</script>

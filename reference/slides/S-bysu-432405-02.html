<div class="viewport"><main class="slide" data-slide-id="S-bysu-432405-02" aria-label="PPT 강의, 많이 들었는데 왜 실력은 그대로일까?"><header class="center-heading"><div class="kicker">이런 경험 있지 않으세요?</div><h1 class="title">PPT 강의, 많이 들었는데<br>왜 실력은 <span>그대로</span>일까?</h1></header><div class="comments"><div class="comment">유명한 PPT 강의를 들었는데 새로운 걸 배우지는 못했어요.</div><div class="comment">강의를 들을 때는 좋았는데 막상 도움이 되지는 않았어요.</div><div class="comment">쉬운 PPT 강의 말고 더 심화된 강의를 듣고 싶어요.</div><div class="comment">PPT 비주얼을 업그레이드 시킬 수 있는 강의가 필요해요.</div></div><svg class="face face-one" viewBox="0 0 120 120" aria-label="아쉬운 표정"><circle cx="60" cy="60" r="58" fill="var(--tint)"/><circle cx="43" cy="48" r="7" fill="var(--text)"/><circle cx="76" cy="46" r="7" fill="var(--text)"/><path d="M43 86Q59 70 79 77" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/></svg><svg class="face face-two" viewBox="0 0 120 120" aria-label="고민하는 표정"><circle cx="60" cy="60" r="58" fill="var(--tint)"/><path d="M32 35l17-6M70 28l17 10M43 87Q59 70 78 85" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/><circle cx="43" cy="51" r="6" fill="var(--text)"/><circle cx="77" cy="54" r="6" fill="var(--text)"/><path d="M26 57Q15 75 28 77Q42 73 26 57" fill="var(--support)"/></svg></main></div>
<script>
(() => {
  const slide = document.querySelector('.slide');
  const fit = () => { slide.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; };
  const theme = new URLSearchParams(location.search).get('theme');
  if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
  addEventListener('resize', fit); fit();
  // file:// frames have isolated origins; relay navigation without reading parent DOM.
  if (parent !== window) document.addEventListener('keydown', event => {
    if (!['ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End', 'Escape', 'f', 'F'].includes(event.key)) return;
    if (event.target.closest('button,input,textarea,select,[contenteditable],.carousel-controls,.carousel-nav')) return;
    queueMicrotask(() => {
      if (!event.defaultPrevented) parent.postMessage({ type: 'gnar-slide-key', key: event.key, shiftKey: event.shiftKey }, '*');
    });
  });
})();
</script>

<div class="viewport"><main class="slide" data-slide-id="S-bysu-432405-07" aria-label="편리한 3 STEP 기업 강의 프로세스"><header class="heading"><div class="kicker">프로세스</div><h1 class="title">편리한 3 STEP<br>기업 강의 프로세스</h1><p class="copy">강의 문의부터 진행까지 완벽할 수 있도록<br>신속하고 정확하게 커뮤니케이션 합니다.</p></header><div class="steps"><section class="step panel"><div class="step-top"><span class="tag">STEP 1</span><h2 class="card-title">강의 문의</h2></div><p class="card-copy">희망하시는 강의 일정, 시간, 인원,<br>장소를 기재하여 문의를 접수해 주세요.<br>확인 후 2영업일 이내 답변드립니다.</p></section><section class="step panel"><div class="step-top"><span class="tag">STEP 2</span><h2 class="card-title">내용 협의</h2></div><p class="card-copy">모든 강의는 기본 커리큘럼을 토대로<br>하며, 희망하시는 일정 및 시간에 따라<br>세부 내용을 조율합니다.</p></section><section class="step panel"><div class="step-top"><span class="tag">STEP 3</span><h2 class="card-title">강의 진행</h2></div><p class="card-copy">강의 장소로 방문하여 진행됩니다.<br>실습 시 노트북을 준비해 주세요.</p></section></div><div class="cta">강의 문의하기</div><svg class="cursor" viewBox="0 0 54 64" aria-hidden="true"><path d="M6 4L46 29L28 33L18 54Z" fill="var(--text)" stroke="var(--surface)" stroke-width="4"/></svg></main></div>
<script>
(() => {
  const slide = document.querySelector('.slide');
  const fit = () => { slide.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; };
  const theme = new URLSearchParams(location.search).get('theme');
  if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
  addEventListener('resize', fit); fit();
  // file:// frames have isolated origins; relay navigation without reading parent DOM.
  if (parent !== window) document.addEventListener('keydown', event => {
    if (!['ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End', 'Escape', 'f', 'F'].includes(event.key)) return;
    if (event.target.closest('button,input,textarea,select,[contenteditable],.carousel-controls,.carousel-nav')) return;
    queueMicrotask(() => {
      if (!event.defaultPrevented) parent.postMessage({ type: 'gnar-slide-key', key: event.key, shiftKey: event.shiftKey }, '*');
    });
  });
})();
</script>
